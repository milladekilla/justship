services:
  app-dev:
    build:
      context: .
      target: dev
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: .env
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
